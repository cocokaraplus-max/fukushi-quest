<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超リアル！キャラクターミニゲーム＆ガチャワールド</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; padding:0; background:#0b0c10; color:#fff;
    font-family:'Arial Black', sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #nav-menu { display:flex; gap:8px; margin-bottom:12px; z-index:100; }
  .nav-btn {
    padding:10px 18px; font-size:15px; font-weight:bold; color:#fff;
    background:#1f2833; border:2px solid #45a29e; border-radius:20px; cursor:pointer; transition:all .2s;
  }
  .nav-btn.active, .nav-btn:hover { background:#66fcf1; color:#0b0c10; border-color:#fff; box-shadow:0 0 15px #66fcf1; }
  #game-stage {
    position:relative; width:520px; height:680px; background:#1f2833;
    border:8px solid #45a29e; border-radius:25px; box-shadow:0 0 35px rgba(102,252,241,.3);
    overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .game-panel {
    display:none; width:100%; height:100%; position:absolute; top:0; left:0;
    flex-direction:column; align-items:center; justify-content:center; padding:15px;
  }
  .game-panel.active { display:flex; }

  /* ── 1. スロット ── */
  #slot-panel { background:linear-gradient(145deg,#111,#222); position:relative; transition:filter .8s ease; }
  #slot-panel.nega-mode { filter:invert(100%) hue-rotate(180deg) contrast(150%); }
  .slot-frame {
    width:100%; height:290px; background:#000; border:6px solid #ffd700; border-radius:15px;
    display:flex; justify-content:space-around; align-items:center; position:relative;
    overflow:hidden; box-shadow:inset 0 0 30px #000; transition:border-color .3s, box-shadow .3s;
  }
  .slot-frame.rainbow-border { animation:realRainbowGlow .35s infinite alternate ease-in-out; }
  @keyframes realRainbowGlow {
    0%   { border-color:#ff0055; box-shadow:0 0 25px #ff0055, inset 0 0 20px #ff0055, 0 0 50px rgba(255,0,255,.8); }
    33%  { border-color:#00ffcc; box-shadow:0 0 25px #00ffcc, inset 0 0 20px #00ffcc, 0 0 50px rgba(0,255,255,.8); }
    66%  { border-color:#ffcc00; box-shadow:0 0 25px #ffcc00, inset 0 0 20px #ffcc00, 0 0 50px rgba(255,255,0,.8); }
    100% { border-color:#ff00ff; box-shadow:0 0 35px #ff00ff, inset 0 0 30px #ff00ff, 0 0 70px rgba(255,0,128,1); }
  }
  .slot-reel { width:120px; height:250px; background:#111; border-radius:8px; overflow:hidden; position:relative; }
  .reel-strip { position:absolute; width:100%; top:0; display:flex; flex-direction:column; align-items:center; }
  .symbol { width:110px; height:110px; object-fit:contain; padding:5px; }
  #freeze-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%; background:#000;
    z-index:80; display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  #freeze-text { font-size:38px; color:#fff; letter-spacing:6px; opacity:0; transition:opacity 1.5s ease-in-out;
                 text-align:center; white-space:pre-line; line-height:1.35; padding:0 14px; }
  #crack-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    z-index:90; pointer-events:none; display:none; overflow:hidden;
  }
  #rainbow-burst-glow {
    position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    background:conic-gradient(from 0deg, rgba(255,0,0,.8), rgba(255,255,0,.8), rgba(0,255,0,.8),
      rgba(0,255,255,.8), rgba(0,0,255,.8), rgba(255,0,255,.8), rgba(255,0,0,.8));
    mix-blend-mode:color-dodge; opacity:0; transition:opacity 2.5s ease-in-out; animation:rotatePrism 3s linear infinite;
  }
  @keyframes rotatePrism { 0%{transform:rotate(0) scale(1);} 50%{transform:rotate(180deg) scale(1.15);} 100%{transform:rotate(360deg) scale(1);} }
  #crack-svg {
    position:absolute; top:0; left:0; width:100%; height:100%;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 0 18px rgba(0,255,255,.8));
    opacity:0; transition:opacity 1.2s ease-in;
  }
  .crack-active #crack-svg { opacity:1; }
  .crack-active #rainbow-burst-glow { opacity:.95; }

  /* ── 2. ガチャポン ── */
  #gacha-panel { background:linear-gradient(135deg,#1f1c2c,#928dab); }
  #gacha-machine { position:relative; width:320px; height:440px; display:flex; flex-direction:column; align-items:center; }
  #gacha-dome {
    width:270px; height:270px; background:rgba(255,255,255,.22);
    border:6px solid rgba(255,255,255,.75); border-radius:50%; position:relative;
    box-shadow:inset -12px -12px 30px rgba(0,0,0,.5), inset 12px 12px 25px rgba(255,255,255,.7), 0 0 30px rgba(255,255,255,.3);
    overflow:hidden;
  }
  /* ★ドームのカプセルを2トーンに（下が色・上が白い光沢） */
  .mini-capsule {
    position:absolute; width:50px; height:50px; border-radius:50%; overflow:hidden;
    box-shadow:inset -4px -6px 8px rgba(0,0,0,.45), 2px 5px 8px rgba(0,0,0,.4);
    transition:transform .1s ease-out, top .1s ease-out, left .1s ease-out;
  }
  .mini-capsule::before {
    content:''; position:absolute; bottom:0; left:0; width:100%; height:50%;
    background:var(--cap-color,#ff4e50); border-top:2px solid rgba(0,0,0,.3);
  }
  .mini-capsule::after {
    content:''; position:absolute; top:0; left:0; width:100%; height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.3) 70%, rgba(255,255,255,.1) 100%);
    border-radius:25px 25px 0 0;
  }
  #gacha-base {
    width:290px; height:180px; background:linear-gradient(180deg,#d32f2f,#8e0000);
    border:5px solid #ffd700; border-radius:20px 20px 10px 10px; margin-top:-30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 10px 25px rgba(0,0,0,.6);
  }
  #gacha-handle {
    width:90px; height:90px; background:#e0e0e0; border:6px solid #666; border-radius:50%;
    position:relative; cursor:pointer; box-shadow:0 6px 0 #444; transition:transform .1s linear;
  }
  #gacha-handle::before {
    content:''; position:absolute; top:50%; left:10%; width:80%; height:16px;
    background:#333; transform:translateY(-50%); border-radius:8px;
  }

  /* ── 3. 釣り ── */
  #fishing-panel { background:linear-gradient(to bottom,#021526,#03346e,#6eacda); }
  #sea-area {
    position:relative; width:100%; height:400px;
    background:radial-gradient(circle at 50% 20%,#4379f2,#021526);
    border:4px solid #6eacda; border-radius:15px; overflow:hidden; cursor:crosshair;
  }
  .fish-shadow {
    position:absolute; background:rgba(0,0,0,.7); border-radius:50% 50% 40% 40%;
    box-shadow:0 0 12px rgba(0,0,0,.9); cursor:pointer;
    transition:transform .2s, left 1.2s ease-in-out, top 1.2s ease-in-out;
  }
  .fish-shadow::after {
    content:''; position:absolute; right:-8px; top:25%; width:0; height:0;
    border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:10px solid rgba(0,0,0,.7);
  }
  .fish-shadow.boss-fish { background:rgba(20,0,0,.85); box-shadow:0 0 20px #ff0055; }
  #float-bobber {
    position:absolute; width:20px; height:20px;
    background:radial-gradient(circle,#ff0055 50%,#fff 50%); border:2px solid #000;
    border-radius:50%; display:none; z-index:20; box-shadow:0 0 10px #fff;
  }
  #hit-indicator {
    position:absolute; font-size:55px; color:#ff0055; font-weight:900;
    text-shadow:0 0 15px #fff, 0 0 30px #ff0055; display:none; z-index:30; animation:bounce .25s infinite alternate;
  }
  #fishing-battle-ui { display:none; flex-direction:column; align-items:center; width:100%; margin-top:10px; }
  #mash-progress-bar { width:80%; height:22px; background:#222; border:3px solid #fff; border-radius:12px; overflow:hidden; margin-bottom:8px; }
  #mash-progress-fill { width:0%; height:100%; background:linear-gradient(90deg,#ff0055,#ffd700); transition:width .1s linear; }
  #fishing-cutin {
    position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,215,0,.9);
    display:none; flex-direction:column; align-items:center; justify-content:center; z-index:95; animation:flashZoom .4s ease-out;
  }

  /* ── 4. 運動会 ── */
  #race-panel { background:linear-gradient(to bottom,#111,#222); }
  #character-select-box {
    display:flex; gap:8px; margin-bottom:8px; background:rgba(0,0,0,.5);
    padding:8px; border-radius:12px; border:1px solid #45a29e;
  }
  .select-thumb {
    width:48px; height:48px; border-radius:50%; border:3px solid #555; cursor:pointer;
    object-fit:cover; transition:transform .2s, border-color .2s;
  }
  .select-thumb.selected { border-color:#ffd700; transform:scale(1.15); box-shadow:0 0 12px #ffd700; }
  #stadium-track {
    position:relative; width:100%; height:380px; background:#a93226; border:6px solid #fff;
    border-radius:15px; overflow:hidden; box-shadow:inset 0 0 30px #000;
  }
  .lane { position:relative; width:100%; height:95px; border-bottom:3px dashed rgba(255,255,255,.7); display:flex; align-items:center; }
  .lane:last-child { border-bottom:none; }
  .runner-wrapper { position:absolute; left:10px; display:flex; flex-direction:column; align-items:center; transition:left .08s linear; }
  .runner-img { width:65px; height:65px; object-fit:contain; filter:drop-shadow(0 5px 5px rgba(0,0,0,.5)); }
  .player-badge {
    position:absolute; top:-20px; background:#ffd700; color:#000; font-size:11px; font-weight:900;
    padding:1px 6px; border-radius:8px; border:1px solid #000; box-shadow:0 0 8px #ffd700; display:none;
  }
  #finish-banner {
    position:absolute; right:40px; top:0; width:12px; height:100%;
    background:repeating-linear-gradient(0deg,#fff,#fff 15px,#000 15px,#000 30px); box-shadow:0 0 10px #fff; z-index:10;
  }
  #race-cutin-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:95;
    display:none; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
  }
  #cutin-img { width:220px; height:220px; object-fit:contain; filter:drop-shadow(0 0 30px #ff0055); }
  #cutin-eye-glow {
    position:absolute; width:100%; height:100%; top:0; left:0;
    background:radial-gradient(circle at 50% 40%, rgba(255,215,0,.8), transparent 60%);
    mix-blend-mode:screen; display:none;
  }
  #cutin-text { font-size:42px; color:#ffd700; text-shadow:0 0 20px #ff0055; margin-top:15px; letter-spacing:4px; animation:flashZoom .3s ease-out; }
  .explosion-effect {
    position:absolute; width:120px; height:120px;
    background:radial-gradient(circle,#ffff00 20%,#ff4500 60%,transparent 80%);
    border-radius:50%; z-index:30; animation:explodeAnim .5s ease-out forwards;
  }
  @keyframes explodeAnim { 0%{transform:scale(.2);opacity:1;} 50%{transform:scale(1.5);opacity:.9;} 100%{transform:scale(2.2);opacity:0;} }
  @keyframes flashZoom { 0%{transform:scale(.5);opacity:0;} 100%{transform:scale(1);opacity:1;} }

  /* ── 共通 ── */
  .action-btn {
    margin-top:12px; width:240px; height:52px; background:linear-gradient(135deg,#ffd700,#ff8c00);
    border:3px solid #fff; border-radius:30px; font-size:19px; font-weight:bold; color:#000;
    cursor:pointer; box-shadow:0 5px 0 #b36200, 0 8px 15px rgba(0,0,0,.4);
  }
  .action-btn:disabled { background:#555; border-color:#777; box-shadow:none; cursor:not-allowed; }
  #result-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s, background .3s; z-index:100;
  }
  #result-overlay.active { opacity:1; pointer-events:auto; }
  /* ★ハズレの結果カード：紫に暗転して、キャラは灰色に沈める */
  #result-overlay.lose-mode{ background:radial-gradient(circle, rgba(30,10,40,.95), rgba(5,5,15,.98)); }
  #result-title.lose-title{ color:#b19ffb; text-shadow:0 0 20px #8a2be2, 0 0 40px #4b0082; }
  #result-img.lose-img{ filter:grayscale(80%) contrast(120%) drop-shadow(0 0 20px #8a2be2) drop-shadow(0 0 40px rgba(0,0,0,.9));
                        transform:scale(.95); }
  #result-title { font-size:52px; color:#ffd700; text-shadow:0 0 20px #ff0055; transition:color .3s, text-shadow .3s; }
  #result-img { width:180px; height:180px; object-fit:contain; margin:15px 0; filter:drop-shadow(0 0 25px #ffd700);
                transition:filter .3s, transform .3s; }
  @keyframes bounce { from{transform:translateY(0) scale(1);} to{transform:translateY(-10px) scale(1.2);} }
  .shake-screen { animation:screenShake .04s infinite; }
  @keyframes screenShake {
    0%{transform:translate(4px,4px) rotate(.5deg);} 50%{transform:translate(-4px,-4px) rotate(-.5deg);} 100%{transform:translate(4px,-4px) rotate(.5deg);}
  }
</style>
</head>
<body>

<div id="testbar">
  <div class="t">結果をえらぶ（本番には出しません。決めるための道具です）</div>
  <div class="row">
    <button data-f="lose"   aria-pressed="false">ハズレ</button>
    <button data-f="win"    aria-pressed="false">通常あたり</button>
    <button data-f="rb"     aria-pressed="false">虹色・反転停止／爆竹</button>
    <button data-f="freeze" aria-pressed="false">フリーズ／覚醒</button>
    <button data-f="nega"   aria-pressed="false" style="grid-column:1/-1;">ネガ反転・ひび割れ（釣りは超大物）</button>
    <button data-f="rand"   aria-pressed="true" style="grid-column:1/-1;">ランダム（本番と同じ）</button>
  </div>
</div>


<div id="nav-menu">
  <button class="nav-btn active" data-g="slot">🎰 超演出スロット</button>
  <button class="nav-btn" data-g="gacha">🔮 リアルガチャ</button>
  <button class="nav-btn" data-g="fishing">🎣 影を選ぶリアル釣り</button>
  <button class="nav-btn" data-g="race">🏃 激熱！運動会</button>
</div>

<div id="game-stage">

  <div id="slot-panel" class="game-panel active">
    <h2 id="slot-header" style="color:#ffd700; text-shadow:0 0 10px #ff0055; margin:0 0 10px 0;">FEVER SLOT</h2>
    <div id="slot-frame" class="slot-frame">
      <div class="slot-reel"><div id="strip1" class="reel-strip"></div></div>
      <div class="slot-reel"><div id="strip2" class="reel-strip"></div></div>
      <div class="slot-reel"><div id="strip3" class="reel-strip"></div></div>
      <div id="crack-overlay">
        <div id="rainbow-burst-glow"></div>
        <svg id="crack-svg" viewBox="0 0 520 290" preserveAspectRatio="none">
          <g stroke="#000000" stroke-width="6" fill="none" opacity="0.8">
            <path d="M 260 145 L 210 70 L 110 105 L 20 10" />
            <path d="M 260 145 L 350 210 L 470 190 L 510 270" />
            <path d="M 260 145 L 310 40 L 440 20" />
            <path d="M 260 145 L 140 230 L 50 210" />
            <polygon points="260,145 230,120 270,110 290,135" />
            <polygon points="260,145 280,170 240,180 230,155" />
          </g>
          <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none">
            <polygon points="260,145 230,120 270,110 290,135" fill="rgba(255,255,255,0.4)" />
            <polygon points="260,145 280,170 240,180 230,155" fill="rgba(255,255,255,0.2)" />
            <path d="M 260 145 L 210 70 L 110 105 L 20 10" />
            <path d="M 210 70 L 230 10" />
            <path d="M 110 105 L 90 180" />
            <path d="M 260 145 L 350 210 L 470 190 L 510 270" />
            <path d="M 350 210 L 390 280" />
            <path d="M 470 190 L 500 120" />
            <path d="M 260 145 L 310 40 L 440 20" />
            <path d="M 310 40 L 260 5" />
            <path d="M 260 145 L 140 230 L 50 210" />
            <path d="M 140 230 L 160 280" />
            <path d="M 180 85 L 150 40" />
            <path d="M 300 175 L 340 140" />
            <path d="M 280 80 L 340 85" />
          </g>
        </svg>
      </div>
    </div>
    <button id="slot-btn" class="action-btn">SPIN!</button>
    <div id="freeze-overlay"><div id="freeze-text">……</div><div id="freeze-sub"></div></div>
  </div>

  <div id="gacha-panel" class="game-panel">
    <h2 style="color:#ffd700; text-shadow:0 0 10px #ff0055; margin:0 0 10px 0;">3D ROTATING GACHA</h2>
    <div id="gacha-machine">
      <div id="gacha-dome"></div>
      <div id="gacha-base">
        <div id="gacha-handle"></div>
        <div id="gacha-exit"><div id="drop-capsule"></div></div>
      </div>
    </div>
  </div>

  <div id="fishing-panel" class="game-panel">
    <h2 style="color:#fff; text-shadow:0 0 10px #6eacda; margin:0 0 2px 0;">SELECT FISH &amp; HIT!</h2>
    <p style="font-size:12px; color:#6eacda; margin:0 0 6px 0;">魚影をタップして仕掛けを投げよう！</p>
    <div id="sea-area">
      <div id="float-bobber"></div>
      <div id="hit-indicator">‼️ HIT ‼️</div>
      <div id="fishing-cutin">
        <h1 style="font-size:48px; color:#d32f2f; text-shadow:0 0 10px #fff; margin:0;">🔥 超大物襲来 🔥</h1>
        <p style="font-size:22px; color:#000;">画面を連打して釣り上げろ！</p>
      </div>
    </div>
    <div id="fishing-battle-ui">
      <div id="mash-progress-bar"><div id="mash-progress-fill"></div></div>
      <button id="hook-btn" class="action-btn" style="margin-top:0;">連打して引き上げろ！</button>
    </div>
    <button id="cast-btn-text" class="action-btn" style="pointer-events:none; opacity:0.6;">魚影を選んでね</button>
  </div>

  <div id="race-panel" class="game-panel">
    <h2 style="color:#ffd700; text-shadow:0 0 10px #ff0055; margin:0 0 4px 0;">REAL CHAMPIONSHIP RACE</h2>
    <p style="font-size:12px; color:#aaa; margin:0 0 6px 0;">自分のキャラクターを選んでスタート！</p>
    <div id="character-select-box"></div>
    <div id="stadium-track">
      <div id="finish-banner"></div>
      <div class="lane"><div id="wrap1" class="runner-wrapper"><span class="player-badge">YOU</span><img id="runner1" class="runner-img" src="" alt=""></div></div>
      <div class="lane"><div id="wrap2" class="runner-wrapper"><span class="player-badge">YOU</span><img id="runner2" class="runner-img" src="" alt=""></div></div>
      <div class="lane"><div id="wrap3" class="runner-wrapper"><span class="player-badge">YOU</span><img id="runner3" class="runner-img" src="" alt=""></div></div>
      <div class="lane"><div id="wrap4" class="runner-wrapper"><span class="player-badge">YOU</span><img id="runner4" class="runner-img" src="" alt=""></div></div>
    </div>
    <button id="race-btn" class="action-btn">レーススタート！</button>
    <div id="race-cutin-overlay">
      <div id="cutin-eye-glow"></div>
      <img id="cutin-img" src="" alt="">
      <div id="cutin-text">⚡️ 覚 醒 ⚡️</div>
      <div id="cutin-sub"></div>
    </div>
  </div>

  <div id="revival-overlay">
    <div id="zawa"><span>ざわ…</span><span>ざわ…</span><span>ざわ…</span><span>ざわ…</span>
      <div id="zawa-plate"></div></div>
    <div id="revival-crack">
      <div id="revival-glow"></div>
      <svg id="revival-svg" viewBox="0 0 520 660" preserveAspectRatio="none">
        <g stroke="#000000" stroke-width="7" fill="none" opacity="0.8">
          <path d="M 260 330 L 200 170 L 90 120 L 10 20" />
          <path d="M 260 330 L 360 470 L 470 520 L 515 640" />
          <path d="M 260 330 L 330 110 L 470 40" />
          <path d="M 260 330 L 130 500 L 40 560" />
          <path d="M 260 330 L 60 380 L 5 350" />
          <polygon points="260,330 220,290 280,275 305,315" />
          <polygon points="260,330 290,375 235,390 222,345" />
        </g>
        <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
          <polygon points="260,330 220,290 280,275 305,315" fill="rgba(255,255,255,0.4)" />
          <polygon points="260,330 290,375 235,390 222,345" fill="rgba(255,255,255,0.2)" />
          <path d="M 260 330 L 200 170 L 90 120 L 10 20" />
          <path d="M 200 170 L 240 40" />
          <path d="M 90 120 L 60 230" />
          <path d="M 260 330 L 360 470 L 470 520 L 515 640" />
          <path d="M 360 470 L 400 620" />
          <path d="M 470 520 L 510 430" />
          <path d="M 260 330 L 330 110 L 470 40" />
          <path d="M 330 110 L 290 15" />
          <path d="M 260 330 L 130 500 L 40 560" />
          <path d="M 130 500 L 155 630" />
          <path d="M 260 330 L 60 380 L 5 350" />
          <path d="M 175 230 L 130 150" />
          <path d="M 315 400 L 370 350" />
          <path d="M 300 215 L 375 225" />
        </g>
      </svg>
    </div>
    <div id="revival-cutin">
      <div id="revival-box">
        <div id="revival-title">⚡ 極 限 復 活 ⚡</div>
        <div id="revival-sub">OVERRIDE ULTRA RARE</div>
        <div id="revival-sub2">絶望からの超大逆転！ 最高レア確定！</div>
      </div>
    </div>
  </div>

  <div id="result-overlay">
    <div id="result-title">WIN!!</div>
    <img id="result-img" src="" alt="">

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function $(id){ return document.getElementById(id); }
  function shuffled(){ return CHARS.slice().sort(function(){ return 0.5-Math.random(); }); }

  /* ── 結果 ── */
  function showResult(title, img, desc, lose){
    $('result-title').textContent = title;
    $('result-title').classList.toggle('lose-title', !!lose);
    var im=$('result-img'); im.src=img; im.classList.toggle('lose-img', !!lose);
    $('result-desc').textContent = desc;
    $('result-overlay').classList.toggle('lose-mode', !!lose);
    /* ★誤連打で結果を見ないまま閉じてしまわないよう、1秒だけ閉じるを止める */
    var cb=$('result-close'); cb.disabled=true; cb.style.opacity='0.5';
    setTimeout(function(){ cb.disabled=false; cb.style.opacity='1'; }, 1000);
    $('result-overlay').classList.add('active');
  }
  var onClosed = null;
  $('result-close').addEventListener('click', function(){
    $('result-overlay').classList.remove('active');
    $('slot-frame').classList.remove('rainbow-border');
    $('slot-panel').classList.remove('nega-mode');
    $('crack-overlay').style.display='none';
    $('crack-overlay').classList.remove('crack-active');
    $('crack-overlay').classList.remove('reveal');
    revivalReset();
    var f=onClosed; onClosed=null; if(f) f();
  });

  /* ══════════ 1. 超演出スロット ══════════ */
  /* ★止まる絵柄を帯のうしろの方に置く。手前だと「1コマ動いただけ」になって回って見えません。
       STOP_AT-1 コマ分（約24コマ）を流すので、3秒まわすとしっかり回転して見えます。 */
  var STRIP_LEN = 52, STOP_AT = 25;
  function initSlot(){
    [1,2,3].forEach(function(n){
      var strip=$('strip'+n); strip.innerHTML='';
      for(var i=0;i<STRIP_LEN;i++){
        var img=document.createElement('img');
        img.src=pick(); img.className='symbol'; img.alt=''; img.decoding='async';
        strip.appendChild(img);
      }
    });
  }
  function symH(){ var s=$('strip1').querySelector('.symbol');
                   return s ? s.getBoundingClientRect().height : 110; }

  var slotBusy=false;
  $('slot-btn').addEventListener('click', function(){
    if(slotBusy) return; slotBusy=true;
    var btn=$('slot-btn'), frame=$('slot-frame');
    btn.disabled=true; frame.classList.remove('rainbow-border');
    $('slot-panel').classList.remove('nega-mode');
    $('crack-overlay').style.display='none';
    $('crack-overlay').classList.remove('crack-active','reveal');
    $('freeze-text').textContent='……'; $('freeze-text').style.opacity='0'; $('freeze-text').style.color='#fff';
    $('freeze-sub').textContent=''; $('freeze-sub').style.opacity='0';

    var res=decide();
    var winChar=pick();

    if(res.mode>=3){
      /* ★フリーズ系は「まずリールが普通に回って、揃って止まって、
           ひと呼吸おいてから」発動する。止まる前に出すと、ただの飾りに見えます。 */
      spinAndStop(winChar, function(){
        if(res.mode===4) crackSeq(res, winChar); else freezeSeq(res, winChar);
      });
    } else if(res.mode===2){
      frame.classList.add('rainbow-border');
      runReels(res, winChar, true, 2.6, 0.7);
    } else {
      runReels(res, winChar, false, 2.6, 0.7);
    }
  });

  /* 3つとも同じ絵柄で、普通に回して止める（フリーズ系の前半） */
  function spinAndStop(winChar, done){
    var h=symH(), end=-(STOP_AT-1)*h;
    [1,2,3].forEach(function(n,idx){
      var strip=$('strip'+n);
      strip.querySelectorAll('.symbol')[STOP_AT].src=winChar;
      strip.style.transition='none'; strip.style.top='0px';
      void strip.offsetHeight;
      setTimeout(function(){
        strip.style.transition='top '+(1.8+idx*0.5)+'s cubic-bezier(0.1,0.85,0.15,1.0)';
        strip.style.top=end+'px';
      }, 50);
    });
    setTimeout(function(){ setTimeout(done, 1200); }, 2800);  /* 止まってから1.2秒の静寂 */
  }

  /* 【ロングフリーズ】画面を落として ためてから 発動 */
  function freezeSeq(res, winChar){
    var ov=$('freeze-overlay'), tx=$('freeze-text');
    ov.style.display='flex';
    setTimeout(function(){ tx.style.opacity='1'; }, 1000);
    setTimeout(function(){
      tx.textContent='⚡ LONG FREEZE ⚡\n極限フリーズ発生！';
      tx.style.color='#ffd700';
      $('game-stage').classList.add('shake-screen');
    }, 3000);
    setTimeout(function(){
      $('game-stage').classList.remove('shake-screen');
      ov.style.display='none';
      $('slot-frame').classList.add('rainbow-border');
      onClosed=function(){ $('slot-btn').disabled=false; slotBusy=false; initSlot(); };
      showResult('🎉 超大当り(フリーズ)!! 🎉', winChar,
                 '全画面の暗転フリーズを経て大当たり！ '+res.prize+' をGET！', false);
    }, 6500);
  }

  /* 【ネガ反転 → ひび割れ → 虹色が溢れる】いちばん重い演出 */
  function crackSeq(res, winChar){
    var panel=$('slot-panel'), frame=$('slot-frame'), crack=$('crack-overlay'), stage=$('game-stage');
    panel.classList.add('nega-mode');
    stage.classList.add('shake-screen');
    setTimeout(function(){
      crack.style.display='block';
      setTimeout(function(){ crack.classList.add('crack-active'); }, 200);
    }, 1500);
    setTimeout(function(){
      frame.classList.add('rainbow-border');
      panel.classList.remove('nega-mode');   /* 色を戻して */
      crack.classList.add('reveal');         /* 光を引かせて 揃った絵を見せる */
      stage.classList.remove('shake-screen');
    }, 6000);
    setTimeout(function(){
      onClosed=function(){ $('slot-btn').disabled=false; slotBusy=false; initSlot(); };
      showResult('🎉 超絶神引き大当り!! 🎉', winChar,
                 '静寂を打ち破るフリーズ＆プリズムひび割れ炸裂！ '+res.prize+' をGET！', false);
    }, 9500);
  }

  function runReels(res, winChar, reverse, dur, step){
    var h=symH();
    var faces=[];
    if(res.win){ faces=[winChar,winChar,winChar]; }
    else {
      var a=pick(), b, c;
      do{ b=pick(); }while(b===a);
      do{ c=pick(); }while(c===a);
      faces=[a,b,c];
    }
    [1,2,3].forEach(function(n,idx){
      var strip=$('strip'+n), sym=strip.querySelectorAll('.symbol');
      sym[STOP_AT].src = faces[idx];
      var end = -(STOP_AT-1)*h;
      strip.style.transition='none';
      strip.style.top = reverse ? (end-(STOP_AT-1)*h)+'px' : '0px';   /* 反転は逆からまわす */
      void strip.offsetHeight;
      setTimeout(function(){
        strip.style.transition='top '+(dur+idx*step)+'s cubic-bezier(0.1,0.85,0.15,1.0)';
        strip.style.top = end+'px';
      }, 50);
    });
    setTimeout(function(){
      onClosed=function(){ $('slot-btn').disabled=false; slotBusy=false; initSlot(); };
      if(res.win){
        showResult('🎉 大当たり!! 🎉', winChar, '3つ揃った！ '+res.prize+' をGET！', false);
      } else {
        showResult('💀 惜しい！ハズレ 💀', pick(), 'もう一度挑戦して大当たりを狙おう！', true);
      }
    }, (dur + 2*step + 1.2)*1000);
  }


  /* ══════════ 2. ガチャポン ══════════ */
  var caps=[], gachaBusy=false, rot=0;
  function initDome(){
    var dome=$('gacha-dome'); dome.innerHTML=''; caps=[];
    var r=dome.getBoundingClientRect(), W=r.width||270;
    for(var i=0;i<14;i++){
      var c=document.createElement('div'); c.className='mini-capsule';
      c.style.width=c.style.height=Math.round(W*0.18)+'px';
      c.style.setProperty('--cap-color', COLORS[i%COLORS.length]);
      c.dataset.rot = Math.floor(Math.random()*360);
      c.style.transform='rotate('+c.dataset.rot+'deg)';
      place(c, W); dome.appendChild(c); caps.push(c);
    }
  }
  /* ★ドームは丸いので、まん中からの距離で置く。
     決め打ちのピクセルだと、画面が小さいときカプセルが外にはみ出します。 */
  function place(el, W){
    var a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*0.34;
    el.style.left=((0.5+Math.cos(a)*rr)*W - W*0.09)+'px';
    el.style.top =((0.52+Math.sin(a)*rr*0.92)*W - W*0.09)+'px';
  }
  /* ★ガチャの流れ
       クランクをガラガラ回す → ドームがガタガタ鳴る → 取り出し口に立体カプセルが落ちてくる
       → 暗いカプセルのときは「ざわ…ざわ…」→ ひび割れ → ⚡極限復活⚡ → キャラ
     ★暗いカプセルは **ハズレのときにも出ます**。必ず復活するなら、ざわついても意味がないので。
       出るか出ないかは見た目だけで、当たりはずれは decide() が決めています。 */
  function capsuleHTML(kind){
    var top = (kind==='dark') ? '#24262c' : COLORS[Math.floor(Math.random()*COLORS.length)];
    return '<div class="capsule-sphere'+(kind==='dark'?' capsule-dark':'')+(kind==='rb'?' capsule-rb':'')+'">'
         + '<div class="capsule-top" style="background:'+top+'"></div>'
         + '<div class="capsule-bottom"></div><div class="capsule-shine"></div></div>';
  }
  function gachaGo(){
    if(gachaBusy) return; gachaBusy=true;
    var res=decide(), winChar=pick();
    var handle=$('gacha-handle'), dome=$('gacha-dome'), exit=$('drop-capsule');
    var W=dome.getBoundingClientRect().width||270;

    /* 暗いカプセル：大逆転のときは必ず、ハズレのときは半分くらい */
    var dark = (res.mode===4) || (res.mode===0 && Math.random()<0.5);
    var kind = dark ? 'dark' : ((res.mode===2||res.mode===3) ? 'rb' : 'normal');

    exit.innerHTML=''; exit.classList.remove('drop-in');
    handle.classList.remove('crank-spin'); void handle.offsetWidth;
    handle.classList.add('crank-spin');
    dome.classList.add('rumble');

    var n=0, iv=setInterval(function(){
      n++; caps.forEach(function(c){
        place(c, W);
        c.dataset.rot = (parseFloat(c.dataset.rot)||0) + (Math.random()*60-30);
        c.style.transform='rotate('+c.dataset.rot+'deg)';
      });
      if(n>=60){                                 /* ★83ms×60回＝5秒ガラガラ */
        clearInterval(iv);
        dome.classList.remove('rumble');
        handle.classList.remove('crank-spin');
        /* 取り出し口にカプセルが落ちてくる */
        exit.innerHTML=capsuleHTML(kind);
        void exit.offsetWidth; exit.classList.add('drop-in');
        setTimeout(function(){ dark ? revival(res, winChar) : finishGacha(res, winChar, false); }, 1200);
      }
    }, 83);
  }
  function finishGacha(res, winChar, viaRevival){
    onClosed=function(){
      gachaBusy=false;
      $('drop-capsule').innerHTML=''; $('drop-capsule').classList.remove('drop-in');
      $('result-img').classList.remove('revival');
    };
    if(res.win) showResult(viaRevival?'⚡ OVERRIDE ULTRA RARE ⚡':'🎉 GET!! 🎉', winChar,
      (viaRevival?'【極限復活】ハズレカプセルが粉砕！ ':'カプセルが開いた！ ')+res.prize+' をGET！', false);
    else showResult('💀 惜しい！ハズレ 💀', pick(), 'カプセルは空っぽだった…　もう一度チャレンジしよう！', true);
    if(viaRevival) $('result-img').classList.add('revival');
  }
  function revivalReset(){
    $('revival-overlay').classList.remove('on');
    $('zawa').classList.remove('on'); $('zawa-plate').textContent='';
    $('revival-crack').classList.remove('on','lit');
    $('revival-cutin').classList.remove('on','violent-shake');
  }
  function revival(res, winChar){
    var ov=$('revival-overlay'), stage=$('game-stage'), plate=$('zawa-plate');
    revivalReset();
    /* ① ざわ… ざわ…（違和感） */
    ov.classList.add('on'); $('zawa').classList.add('on');
    plate.textContent='ざわ… ざわ…（ハズレカプセル出現）'; plate.style.color='#c4b5fd';
    /* ② パカッ…！？ カプセルが震えだす */
    setTimeout(function(){
      plate.textContent='💥 パカッ…！？ カプセルがシェイクしている！'; plate.style.color='#ff5470';
      stage.classList.add('shake-screen');
    }, 3500);
    setTimeout(function(){
      $('zawa').classList.remove('on');
      if(!res.win){                      /* ハズレ：ざわついたが 割れずに終わり */
        stage.classList.remove('shake-screen');
        revivalReset(); finishGacha(res, winChar, false); return;
      }
      /* ③ 画面がひび割れて ⚡極限復活⚡ */
      $('revival-crack').classList.add('on');
      setTimeout(function(){ $('revival-crack').classList.add('lit'); }, 60);
      setTimeout(function(){ $('revival-cutin').classList.add('on','violent-shake'); }, 600);
      setTimeout(function(){ $('revival-cutin').classList.remove('violent-shake'); }, 1900);
      setTimeout(function(){
        stage.classList.remove('shake-screen');
        revivalReset();
        finishGacha(res, winChar, true);
      }, 4500);   /* ★じっくり見せる */
    }, 6000);
  }
  $('gacha-handle').addEventListener('click', gachaGo);

  /* ══════════ 3. 影を選ぶリアル釣り ══════════
     ★大きい影（大物）は 最初から見えていて、選べます。
       ただし 当たりはずれは decide() が決めます。大物を選んでも バラすことがある。
     ★連打は **見せ場だけ**。速さで結果が変わると、小さい子やお年寄りに不公平になるため、
       ゲージは押さなくても ゆっくり自分で上がり、必ず引き上げまで行きます。 */
  var fishBusy=false, fishRes=null, fishBoss=false, mashOn=false, mashP=0, mashIv=null, mashCap=null;
  function initFish(){
    var sea=$('sea-area');
    [].slice.call(sea.querySelectorAll('.fish-shadow')).forEach(function(f){ f.remove(); });
    var r=sea.getBoundingClientRect();
    for(var i=0;i<4;i++){
      var boss = (i===0 && Math.random()<0.4);
      var f=document.createElement('div');
      f.className='fish-shadow'+(boss?' boss-fish':'');
      f.dataset.boss = boss ? '1' : '';
      var w = boss ? 65 : rnd(26,52);
      f.style.width=w+'px'; f.style.height=(w*0.4)+'px';
      f.style.left=rnd(r.width*0.10, r.width*0.78)+'px';
      f.style.top =rnd(r.height*0.28, r.height*0.80)+'px';
      f.addEventListener('click', function(ev){ cast(ev.currentTarget, ev); });
      sea.appendChild(f);
    }
    $('cast-btn-text').textContent='魚影を選んでね';
    $('cast-btn-text').style.display='';
    $('fishing-battle-ui').style.display='none';
    $('fishing-cutin').style.display='none';
    $('hit-indicator').style.display='none';
    $('float-bobber').style.display='none';
    $('mash-progress-fill').style.width='0%';
  }
  setInterval(function(){
    if(fishBusy) return;
    var sea=$('sea-area'), r=sea.getBoundingClientRect();
    [].slice.call(sea.querySelectorAll('.fish-shadow')).forEach(function(f){
      var x=parseFloat(f.style.left), y=parseFloat(f.style.top);
      var nx=Math.min(Math.max(x+rnd(-55,55), r.width*0.06), r.width*0.82);
      var ny=Math.min(Math.max(y+rnd(-32,32), r.height*0.24), r.height*0.84);
      f.style.transition='left 1.2s ease-in-out, top 1.2s ease-in-out';
      f.style.left=nx+'px'; f.style.top=ny+'px';
      f.style.transform = (nx<x) ? 'scaleX(-1)' : 'scaleX(1)';
    });
  }, 1400);

  function cast(fish, ev){
    if(fishBusy) return; fishBusy=true;
    fishRes=decide();
    fishBoss = (fish.dataset.boss==='1');
    var sea=$('sea-area'), bob=$('float-bobber'), hit=$('hit-indicator');
    var r=sea.getBoundingClientRect();
    var x=(ev.clientX-r.left), y=(ev.clientY-r.top);
    bob.style.left=(x-9)+'px'; bob.style.top=(y-9)+'px'; bob.style.display='block';
    fish.style.transition='left 1s ease-out, top 1s ease-out';
    fish.style.left=(x-15)+'px'; fish.style.top=(y-5)+'px';
    $('cast-btn-text').textContent='……アタリを待っている';
    setTimeout(function(){
      hit.textContent = fishBoss ? '‼️ 大物だ ‼️' : '‼️ HIT ‼️';
      hit.style.left=(x-60)+'px'; hit.style.top=(y-70)+'px'; hit.style.display='block';
      setTimeout(function(){
        hit.style.display='none';
        if(fishBoss){
          /* 【超大物カットイン】大きい影を選んだときだけ */
          var cut=$('fishing-cutin'); cut.style.display='flex';
          $('game-stage').classList.add('shake-screen');
          setTimeout(function(){
            $('game-stage').classList.remove('shake-screen');
            cut.style.display='none'; startBattle(fishBoss);
          }, 3500);   /* ★文字を読む間をとる */
        } else {
          startBattle(false);
        }
      }, 700);
    }, rnd(800,2000));
  }

  /* 連打バトル。押すと速く上がる。押さなくても必ず最後まで上がる。 */
  function startBattle(boss){
    mashOn=true; mashP=0;
    $('cast-btn-text').style.display='none';
    $('fishing-battle-ui').style.display='flex';
    $('mash-progress-fill').style.width='0%';
    $('hook-btn').disabled=false;
    var auto = boss ? 3.0 : 3.6;
    mashIv = setInterval(function(){ addMash(auto); }, 180);
    mashCap = setTimeout(function(){ mashP=100; finishBattle(); }, boss?7000:7000);
  }
  function addMash(v){
    if(!mashOn) return;
    mashP = Math.min(100, mashP + v);
    $('mash-progress-fill').style.width = mashP+'%';
    if(mashP>=100) finishBattle();
  }
  function finishBattle(){
    if(!mashOn) return; mashOn=false;
    clearInterval(mashIv); clearTimeout(mashCap);
    $('hook-btn').disabled=true;
    $('mash-progress-fill').style.width='100%';
    setTimeout(function(){
      $('fishing-battle-ui').style.display='none';
      $('cast-btn-text').style.display='';
      $('float-bobber').style.display='none';
      var winChar=pick();
      onClosed=function(){ fishBusy=false; initFish(); };
      if(fishRes.win) showResult(fishBoss?'🎣 超大物を釣り上げた！！ 🎣':'🎣 釣り上げた！！ 🎣', winChar,
        '激しい引きに打ち勝った！ '+fishRes.prize+' をGET！', false);
      else            showResult('💀 惜しい！ハズレ 💀', pick(),
        fishBoss?'あと少しでバラしてしまった…　もう一度チャレンジしよう！':'バラしてしまった…　もう一度チャレンジしよう！', true);
    }, 350);
  }
  $('hook-btn').addEventListener('click', function(){
    if(!mashOn) return;
    addMash(9);
    $('game-stage').classList.add('shake-screen');
    setTimeout(function(){ $('game-stage').classList.remove('shake-screen'); }, 80);
  });

  /* ══════════ 4. 激熱！運動会 ══════════
     ★勝ち負けは decide() が決めます。選んだキャラや走りでは変わりません。
       当たりのとき「どの演出で勝つか」だけを mode で分けています。
       覚醒・爆竹は **勝ちが決まったときだけ** 出る演出です。 */
  var raceBusy=false, myIdx=0, raceChars=[];
  function initRace(){
    var box=$('character-select-box'); box.innerHTML='';
    raceChars = shuffled().slice(0,4);
    myIdx = 0;
    raceChars.forEach(function(src,i){
      var im=document.createElement('img');
      im.className='select-thumb'+(i===0?' selected':''); im.src=src; im.alt='';
      im.addEventListener('click', function(){
        if(raceBusy) return;
        myIdx=i;
        [].slice.call(box.querySelectorAll('.select-thumb')).forEach(function(o,k){
          o.classList.toggle('selected', k===i); });
        badges();
      });
      box.appendChild(im);
      /* ★走者の絵は、開いた時点から見えていること。
         前は スタートを押すまで空のレーンだけが並んでいました。 */
      $('runner'+(i+1)).src=src;
      $('wrap'+(i+1)).style.left='10px';
    });
    badges();
    $('race-cutin-overlay').style.display='none';
    $('cutin-eye-glow').style.display='none';
    [].slice.call($('stadium-track').querySelectorAll('.explosion-effect')).forEach(function(e){ e.remove(); });
  }
  function badges(){
    for(var i=1;i<=4;i++) $('wrap'+i).querySelector('.player-badge').style.display = (i-1===myIdx)?'block':'none';
  }

  $('race-btn').addEventListener('click', function(){
    if(raceBusy) return; raceBusy=true;
    $('race-btn').disabled=true;
    var res=decide();
    var track=$('stadium-track');
    [].slice.call(track.querySelectorAll('.explosion-effect')).forEach(function(e){ e.remove(); });

    var wraps=[$('wrap1'),$('wrap2'),$('wrap3'),$('wrap4')];
    wraps.forEach(function(w){ w.style.left='10px'; });

    var ME=myIdx;
    var first = res.win ? ME : (function(){ var o=[0,1,2,3].filter(function(n){return n!==ME;});
                                            return o[Math.floor(Math.random()*o.length)]; })();
    var kaku = res.win && (res.mode===3 || res.mode===4);   /* 覚醒カットイン */
    var baku = res.win && (res.mode===2 || res.mode===4);   /* 爆竹カットイン */
    var rev  = kaku || baku;

    var goal = Math.max(120, track.getBoundingClientRect().width - 85);
    var k = goal/380;                      /* 画面の幅に合わせて速さも伸び縮みさせる */
    var pos=[10,10,10,10], done=false, iv=null;

    function finish(){
      if(done) return; done=true;
      clearInterval(iv); track.classList.remove('shake-screen');
      setTimeout(function(){
        onClosed=function(){ $('race-btn').disabled=false; raceBusy=false; initRace(); };
        if(res.win) showResult(
          kaku?'🏆 覚醒！1位ゴール！ 🏆' : baku?'🏆 爆発一人勝ち！ 🏆' : '🏆 1位ゴール！ 🏆',
          raceChars[ME],
          (kaku?'目が光り 猛ダッシュでごぼう抜き！ ':baku?'邪魔者を吹き飛ばして堂々の1位！ ':'見事1位でゴールイン！ ')
          +res.prize+' をGET！', false);
        else showResult('💀 惜しくも敗北 💀', raceChars[ME], 'ライバルに届かなかった…　もう一度チャレンジしよう！', true);
      }, 450);
    }

    /* 第1幕：逆転演出があるときは、わざとライバルに先行させる */
    var fired=false;
    track.classList.add('shake-screen');
    iv=setInterval(function(){
      for(var i=0;i<4;i++){
        var sp=rnd(3,10)*k;
        if(rev && !fired && i!==ME) sp+=3*k;
        if(!rev && i===first && pos[i]>goal*0.5) sp+=5*k;
        pos[i]+=sp; if(pos[i]>goal) pos[i]=goal;
        wraps[i].style.left=pos[i]+'px';
      }
      if(rev && !fired && pos[ME]>=goal*0.46){
        fired=true; clearInterval(iv); track.classList.remove('shake-screen');
        if(kaku) cutinKaku(function(){ if(baku) cutinBaku(wraps,pos,ME,goal,k,function(){ act2(28); }); else act2(28); });
        else     cutinBaku(wraps,pos,ME,goal,k,function(){ act2(15); });
        return;
      }
      if(pos[first]>=goal) finish();
    }, 60);

    /* 第2幕：超スピードでゴールまで */
    function act2(mySpeed){
      track.classList.add('shake-screen');
      iv=setInterval(function(){
        for(var i=0;i<4;i++){
          var sp = (i===ME) ? mySpeed*k : rnd(2,8)*k;
          pos[i]+=sp; if(pos[i]>goal) pos[i]=goal;
          wraps[i].style.left=pos[i]+'px';
        }
        if(pos[ME]>=goal) finish();
      }, 50);
    }
  });

  function cutinKaku(next){
    var ov=$('race-cutin-overlay');
    $('cutin-img').src=raceChars[myIdx];
    $('cutin-text').textContent='⚡️ 覚 醒 ⚡️';
    $('cutin-sub').textContent='目が光った！ ここからごぼう抜きだ！';
    $('cutin-eye-glow').style.display='block';
    ov.style.display='flex';
    setTimeout(function(){ $('game-stage').classList.add('shake-screen'); }, 500);
    setTimeout(function(){ $('game-stage').classList.remove('shake-screen'); }, 1400);
    setTimeout(function(){
      ov.style.display='none'; $('cutin-eye-glow').style.display='none';
      next();
    }, 3500);   /* ★文字を読む間をとる */
  }
  function cutinBaku(wraps, pos, ME, goal, k, next){
    var ov=$('race-cutin-overlay'), track=$('stadium-track');
    $('cutin-img').src=raceChars[myIdx];
    $('cutin-text').textContent='💣 爆竹投入！ 💣';
    $('cutin-sub').textContent=['ハプニング発生！','ライバルが吹き飛ぶ！','コースが大混乱！'][Math.floor(Math.random()*3)];
    $('cutin-eye-glow').style.display='none';
    ov.style.display='flex';
    setTimeout(function(){
      ov.style.display='none';
      for(var i=0;i<4;i++){
        if(i===ME) continue;
        var e=document.createElement('div'); e.className='explosion-effect';
        e.style.left=Math.max(0,pos[i]-10)+'px';
        e.style.top =(i*25+2)+'%';
        track.appendChild(e);
        (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 600); })(e);
        pos[i]=Math.max(10, pos[i]-60*k);     /* 吹き飛ばされて後ろへ */
        wraps[i].style.left=pos[i]+'px';
      }
      $('game-stage').classList.add('shake-screen');
      setTimeout(function(){
        $('game-stage').classList.remove('shake-screen');
        next();
      }, 500);
    }, 3500);   /* ★文字を読む間をとる */
  }

  /* ══════════ 切りかえ ══════════ */
  [].slice.call(document.querySelectorAll('#nav-menu .nav-btn')).forEach(function(b){
    b.addEventListener('click', function(){
      [].slice.call(document.querySelectorAll('.game-panel')).forEach(function(p){ p.classList.remove('active'); });
      [].slice.call(document.querySelectorAll('.nav-btn')).forEach(function(o){ o.classList.remove('active'); });
      $(b.dataset.g+'-panel').classList.add('active'); b.classList.add('active');
      if(b.dataset.g==='fishing' && !fishBusy)  initFish();
      if(b.dataset.g==='gacha'   && !gachaBusy) initDome();
      if(b.dataset.g==='slot'    && !slotBusy)  initSlot();
      if(b.dataset.g==='race'    && !raceBusy)  initRace();
    });
  });

  /* ══════════ テストバー ══════════ */
  [].slice.call(document.querySelectorAll('#testbar button')).forEach(function(b){
    b.addEventListener('click', function(){
      [].slice.call(document.querySelectorAll('#testbar button')).forEach(function(o){
        o.setAttribute('aria-pressed', o===b?'true':'false'); });
      FORCE=b.dataset.f;
    });
  });

  initSlot(); initDome(); initFish(); initRace();
  addEventListener('resize', function(){ if(!fishBusy) initFish(); if(!gachaBusy) initDome(); });
})();
</script>

</body>
</html>
