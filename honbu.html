<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUKUSHI QUEST 本部モニター</title>
<style>
  :root{ --bg:#211c14; --panel:#2c2519; --line:#3d3527; --cream:#f2ecdd; --gold:#e0b64a; --sub:#c9bfa6; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--cream);
        font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px;
          background:linear-gradient(180deg,#2c2519,#211c14); border-bottom:2px solid var(--line); }
  header h1{ margin:0; font-size:26px; letter-spacing:.06em; }
  header h1 b{ color:var(--gold); }
  header .st{ font-size:13px; color:var(--sub); }
  .wrap{ display:grid; grid-template-columns:1.35fr 1fr; gap:18px; padding:18px 22px; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h2{ margin:0 0 12px; font-size:19px; color:var(--gold); letter-spacing:.04em; }
  /* 在庫 */
  .prize{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
  .prize:last-child{ border-bottom:none; }
  .rchip{ min-width:44px; text-align:center; font-weight:800; font-size:12px; padding:4px 6px; border-radius:8px; color:#211c14; }
  .r1{ background:#7db4d8; } .r2{ background:#79c08a; } .r3{ background:#e08a8a; } .r4{ background:linear-gradient(90deg,#e0b64a,#f0d98a); }
  .pname{ flex:1; font-size:17px; }
  .pnum{ font-size:15px; color:var(--sub); min-width:96px; text-align:right; }
  .pnum b{ font-size:22px; color:var(--cream); }
  .pnum.zero b{ color:#e07a7a; }
  .bar{ width:150px; height:12px; background:#1c180f; border-radius:6px; overflow:hidden; margin-left:8px; }
  .bar>i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold),#f0d98a); }
  /* ランキング */
  .rk{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .rk:last-child{ border-bottom:none; }
  .rank{ min-width:40px; font-weight:900; font-size:20px; color:var(--gold); text-align:center; }
  .rank.top1{ color:#ffd76a; } .rank.top2{ color:#d9d9d9; } .rank.top3{ color:#d8a56b; }
  .nick{ flex:1; font-size:17px; }
  .recog{ font-size:12px; color:var(--sub); }
  .pts{ font-size:20px; font-weight:800; }
  .pts small{ font-size:12px; color:var(--sub); font-weight:400; }
  .foot{ padding:8px 22px 18px; color:var(--sub); font-size:12px; }
  .demo{ display:inline-block; margin-left:10px; padding:2px 8px; border:1px solid var(--line); border-radius:8px; color:#e0b64a; font-size:12px; }
  /* fq-reset-button-v1: 大会リセット（?admin=1 のときだけ出る） */
  .acard{ border-color:#7a3b3b; }
  .acard h2{ color:#e08a8a; }
  .astats{ font-size:14px; color:var(--sub); line-height:2; margin-bottom:12px; }
  .astats b{ color:var(--cream); font-size:18px; }
  .abtn{ background:#8a3b3b; color:#fff; border:1px solid #b25a5a; border-radius:10px;
         padding:11px 20px; font-size:16px; font-weight:800; cursor:pointer; }
  .abtn:disabled{ background:#4a3535; border-color:#5a4444; color:#9b8f8f; cursor:not-allowed; }
  .anote{ font-size:12px; color:var(--sub); margin:10px 0 0; line-height:1.8; }
  .amodal{ display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.72);
           align-items:center; justify-content:center; padding:16px; }
  .amodal.on{ display:flex; }
  .abox{ background:var(--panel); border:2px solid #7a3b3b; border-radius:14px;
         padding:20px 22px; max-width:520px; width:100%; }
  .abox h3{ margin:0 0 12px; color:#e08a8a; font-size:20px; }
  .abox label{ display:block; margin:12px 0 4px; font-size:14px; }
  .abox input[type=password]{ width:100%; padding:10px 12px; border-radius:8px;
         border:1px solid var(--line); background:#1c180f; color:var(--cream); font-size:16px; }
  .aack{ display:flex; gap:8px; align-items:flex-start; margin-top:14px; font-size:14px; }
  .aack input{ width:20px; height:20px; margin-top:2px; flex:0 0 auto; }
  .amsg{ margin-top:12px; font-size:14px; min-height:22px; }
  .amsg.ng{ color:#e08a8a; } .amsg.ok{ color:#79c08a; }
  .arow{ display:flex; gap:10px; margin-top:16px; }
  .arow button{ flex:1; }
  .cbtn{ background:#3d3527; color:var(--cream); border:1px solid var(--line);
         border-radius:10px; padding:11px 20px; font-size:16px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>FUKUSHI <b>QUEST</b> 本部モニター</h1>
  <div class="st" id="st">接続中…</div>
</header>
<div class="wrap">
  <div class="card">
    <h2>🎁 景品 在庫</h2>
    <div id="prizes"></div>
  </div>
  <div class="card">
    <h2>🏆 ランキング</h2>
    <div id="ranking"></div>
  </div>
</div>
<!-- fq-reset-button-v1: ?admin=1 のときだけ出る -->
<div class="wrap" id="adminWrap" style="display:none;">
  <div class="card acard">
    <h2>⚠ 大会リセット</h2>
    <div class="astats" id="adminStats">読み込み中…</div>
    <button class="abtn" id="resetOpen">大会をリセットする</button>
    <p class="anote">参加者・抽選履歴をすべて消し、認識番号を1番に戻し、景品の残数を最初の数に戻します。
    <b style="color:#e08a8a;">元に戻せません。</b><br>
    本番の前日か、テストのあとに使ってください。</p>
  </div>
</div>
<div class="amodal" id="resetModal">
  <div class="abox">
    <h3>大会リセット</h3>
    <div class="astats" id="resetWhat"></div>
    <label for="resetPass">合言葉</label>
    <!-- fq-pass-eye-v1: 打ち間違いに気づけるよう、見るボタンを付ける -->
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="password" id="resetPass" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;">
      <button type="button" id="resetEye" class="cbtn" title="合言葉を見る"
              style="flex:0 0 auto;padding:10px 13px;font-size:18px;line-height:1;">👁</button>
    </div>
    <label class="aack"><input type="checkbox" id="resetAck">
      <span>消えたデータは戻せないことを理解しました</span></label>
    <div class="amsg" id="resetMsg"></div>
    <div class="arow">
      <button class="abtn" id="resetGo" disabled>この内容で消す</button>
      <button class="cbtn" id="resetCancel">やめる</button>
    </div>
  </div>
</div>
<div class="foot">自動更新（リアルタイム）。景品確定ごとに在庫が減り、ポイント獲得でランキングが動きます。<span id="demo"></span></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg = window.FQ_CONFIG || {};
const REAL = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("YOUR-PROJECT")<0 && window.supabase;
const rchip = r => `<span class="rchip r${r}">${({1:'青',2:'緑',3:'赤',4:'虹'})[r]||'-'}</span>`;
function renderPrizes(rows){
  rows=(rows||[]).slice().sort((a,b)=>(a.sort-b.sort)||a.name.localeCompare(b.name));
  document.getElementById('prizes').innerHTML = rows.map(p=>{
    const pct = p.initial_stock>0 ? Math.round(p.stock/p.initial_stock*100) : 0;
    return `<div class="prize">${rchip(p.rarity)}
      <span class="pname">${p.name}</span>
      <span class="pnum ${p.stock<=0?'zero':''}"><b>${p.stock}</b> / ${p.initial_stock}</span>
      <span class="bar"><i style="width:${pct}%"></i></span></div>`;
  }).join('') || '<div class="prize">景品が未登録です</div>';
}
function renderRanking(rows){
  rows=(rows||[]).slice().sort((a,b)=>b.points-a.points).slice(0,20);
  document.getElementById('ranking').innerHTML = rows.map((r,i)=>{
    const rk=i+1, cls = rk<=3?`top${rk}`:'';
    return `<div class="rk"><span class="rank ${cls}">${rk}</span>
      <span class="nick">${r.nickname||'（未設定）'}<span class="recog"> ・ ${r.recog_no||''}</span></span>
      <span class="pts">${r.points}<small> pt</small></span></div>`;
  }).join('') || '<div class="rk">まだ参加者がいません</div>';
}

async function boot(){
  const st=document.getElementById('st');
  if(!REAL){
    document.getElementById('demo').innerHTML='<span class="demo">DEMO表示（config.js未設定）</span>';
    st.textContent='デモ表示';
    renderPrizes([
      {name:'地域店舗 商品券 500円',rarity:1,stock:82,initial_stock:100,sort:10},
      {name:'カフェ ドリンク券',rarity:1,stock:74,initial_stock:100,sort:11},
      {name:'オリジナルグッズ',rarity:2,stock:31,initial_stock:50,sort:20},
      {name:'ノベルティ 文具セット',rarity:2,stock:40,initial_stock:50,sort:21},
      {name:'キッチンカー 利用券',rarity:3,stock:6,initial_stock:20,sort:30},
      {name:'特賞 コラボグッズ',rarity:4,stock:1,initial_stock:5,sort:40},
    ]);
    renderRanking([
      {nickname:'ハルカ',recog_no:'4737',points:34},{nickname:'そうた',recog_no:'1180',points:29},
      {nickname:'みお',recog_no:'2093',points:27},{nickname:'けんと',recog_no:'5521',points:22},
      {nickname:'あやの',recog_no:'0846',points:18},{nickname:'ゆうき',recog_no:'3312',points:15},
    ]);
    return;
  }
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  async function load(){
    const [{data:pz},{data:rk}] = await Promise.all([
      sb.from('prizes').select('*'),
      sb.from('ranking').select('recog_no,nickname,points,rank').gt('points',0).order('rank',{ascending:true}).limit(20)
    ]);
    renderPrizes(pz); renderRanking(rk);
    st.textContent='更新 '+new Date().toLocaleTimeString('ja-JP');
  }
  /* fq-honbu-lite-v1: 1500人規模むけの軽量化
     - ランキングは上位20人だけ取る（全件だと1回90KB）
     - realtimeは1件ごとに飛んでくるので、まとめて3秒に1回だけ取り直す
       （1500人が7回スキャンすると1万件。そのたびに取り直すと本部だけで数百MB） */
  let t=null, loading=false;
  async function safeLoad(){ if(loading) return; loading=true; try{ await load(); }catch(e){ console.warn(e); } loading=false; }
  function bump(){ if(t) return; t=setTimeout(function(){ t=null; safeLoad(); }, 3000); }
  await safeLoad();
  sb.channel('honbu')
    .on('postgres_changes',{event:'*',schema:'public',table:'prizes'},bump)
    .on('postgres_changes',{event:'*',schema:'public',table:'participants'},bump)
    .subscribe();
  setInterval(safeLoad, 30000); // 保険のポーリング
}
boot();
</script>

<!-- fq-reset-button-v1 -->
<script>
/* 本部の画面から大会をリセットする。
   ★出るのは honbu.html?admin=1 のときだけ。
   ★守りの本体は合言葉（Supabase の中で照合する。ここには持たせない）。
   ★先に fq_reset_button.sql を Supabase で Run しておくこと。 */
(function(){
  'use strict';
  var p = new URLSearchParams(location.search);
  if (p.get('admin') !== '1') return;

  var cfg = window.FQ_CONFIG || {};
  var real = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf('YOUR-PROJECT') < 0 && window.supabase;
  var wrap = document.getElementById('adminWrap');
  var stats = document.getElementById('adminStats');
  wrap.style.display = '';

  if (!real) { stats.textContent = 'config.js が未設定なので、リセットは使えません。';
               document.getElementById('resetOpen').disabled = true; return; }

  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var last = null;

  function fmt(s){
    return '参加者 <b>' + s.participants + '</b> 人　／　抽選の履歴 <b>' + s.draws + '</b> 件<br>'
         + '合計ポイント <b>' + s.points_total + '</b>　／　次に配る認識番号 <b>'
         + String(s.next_recog).padStart(4,'0') + '</b><br>'
         + '残数が減っている景品 <b>' + s.prizes_used + '</b> 種類';
  }
  function load(){
    return sb.rpc('fq_stats').then(function(r){
      if (r.error) throw r.error;
      last = r.data;
      stats.innerHTML = fmt(last);
      return last;
    }).catch(function(e){
      stats.textContent = '件数を取れませんでした（' + (e.message || e) + '）。'
        + ' fq_reset_button.sql をまだ Run していないかもしれません。';
      document.getElementById('resetOpen').disabled = true;
    });
  }
  load();

  var modal = document.getElementById('resetModal');
  var pass  = document.getElementById('resetPass');
  var ack   = document.getElementById('resetAck');
  var go    = document.getElementById('resetGo');
  var msg   = document.getElementById('resetMsg');
  /* fq-pass-eye-v1: 押すたびに 見える／隠れる を切り替える。
     ★人前で押さないこと。ページを開き直せば必ず隠れた状態から始まる。 */
  var eye = document.getElementById('resetEye');
  if (eye) eye.addEventListener('click', function(){
    var showing = (pass.type === 'text');
    pass.type = showing ? 'password' : 'text';
    eye.textContent = showing ? '👁' : '🙈';
    eye.title = showing ? '合言葉を見る' : '合言葉を隠す';
    try { pass.focus(); } catch(e) {}
  });

  function sync(){ go.disabled = !(pass.value.trim() && ack.checked); }
  pass.addEventListener('input', sync);
  ack.addEventListener('change', sync);

  document.getElementById('resetOpen').addEventListener('click', function(){
    load().then(function(){
      document.getElementById('resetWhat').innerHTML =
        'いま消えるのは、この内容です。<br><br>' + (last ? fmt(last) : '');
      pass.value = ''; ack.checked = false; msg.textContent = ''; msg.className = 'amsg';
      sync(); modal.classList.add('on'); pass.focus();
    });
  });
  document.getElementById('resetCancel').addEventListener('click', function(){
    modal.classList.remove('on');
  });

  go.addEventListener('click', function(){
    go.disabled = true;
    msg.className = 'amsg'; msg.textContent = '実行中…';
    sb.rpc('fq_reset', { p_pass: pass.value }).then(function(r){
      if (r.error) throw r.error;
      var d = r.data || {};
      if (d.ok) {
        msg.className = 'amsg ok';
        msg.innerHTML = 'リセットしました（参加者 ' + d.participants + ' 人・抽選 ' + d.draws + ' 件を削除）。';
        pass.value = ''; ack.checked = false;
        load();
        setTimeout(function(){ modal.classList.remove('on'); }, 2500);
      } else {
        msg.className = 'amsg ng';
        msg.textContent = d.message || 'リセットできませんでした。';
        sync();
      }
    }).catch(function(e){
      msg.className = 'amsg ng';
      msg.textContent = '通信エラー: ' + (e.message || e);
      sync();
    });
  });
})();
</script>
</body>
</html>
