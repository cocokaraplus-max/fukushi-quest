<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>大抽選会</title>
<!-- fq-grand-v3: 会場のスクリーンに出す画面。出すのは「番号」と「なまえ」だけ。
     ・操作は本部モニター（honbu.html?admin=1 の「大抽選会」）でする。合言葉・賞の名前・抽選のボタンは向こうにある
     ・同じパソコンの別のウィンドウとして開き、プロジェクターの画面に全画面で出す（本部モニターの「会場の画面を開く」）
     ・本部モニターから合図（BroadcastChannel）が来ると、ドラムロール → 桁が1つずつ止まる → ファンファーレ
     ★サーバーには何も聞かない。当たりを決めるのは本部モニター側（サーバー）。この画面は見せるだけ
     ★ブラウザは、画面を1回押すまで音を出させてくれない。開いたら1回クリックしておく -->
<style>
  html,body{ margin:0; height:100%; background:#0d0a05; color:#f7efd9; overflow:hidden;
    /* fq-grand-v6: 夜空は body に。花火の絵（canvas）を夜空と文字のあいだに置く */
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif; cursor:default; }
  .stage{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:transparent; z-index:1; }
  body{ background:radial-gradient(ellipse at center,#2c2416 0%,#0d0a05 70%) fixed; }
  .no{ font-size:min(32vw,48vh); font-weight:900; letter-spacing:.06em; line-height:1; font-variant-numeric:tabular-nums; }
  .no span{ display:inline-block; min-width:.62em; text-align:center; }
  .no span.lock{ color:#f0c95a; text-shadow:0 0 .12em rgba(240,201,90,.75); }
  .nm{ margin-top:4vh; font-size:min(9vw,11vh); font-weight:800; min-height:1.3em; letter-spacing:.06em; opacity:0; transition:opacity .6s; }
  .nm.show{ opacity:1; }
  .stage.flash{ animation:fl 1.4s ease-out; }
  @keyframes fl{ 0%{ background:#f7e3a0; } 100%{ background:transparent; } }
  /* fq-grand-v4: 待っている間は「大抽選会」 */
  .idle .no{ font-size:min(17vw,26vh); letter-spacing:.12em; color:#f0c95a; text-shadow:0 0 .1em rgba(240,201,90,.55); }
  .hint{ position:fixed; left:0; right:0; bottom:2vh; text-align:center; font-size:14px; color:#8a7a5a; }
  .hint.off{ display:none; }
  /* fq-grand-smile-v1: 笑顔コンテストの1位発表 */
  #smStage{ position:fixed; inset:0; z-index:2; display:none; flex-direction:column; align-items:center; justify-content:center; gap:2.4vh; }
  #smStage.on{ display:flex; }
  #smStage .ttl{ font-size:min(6.4vw,8.4vh); font-weight:900; color:#f0c95a; letter-spacing:.1em; text-shadow:0 0 .1em rgba(240,201,90,.55); }
  #smStage .row{ display:flex; flex-wrap:wrap; gap:2.6vh 2.4vw; align-items:flex-start; justify-content:center; max-width:94vw; }
  #smStage .row.many .pic{ width:min(19vw,26vh); height:min(19vw,26vh); }
  #smStage .row.many .cap{ margin-top:.8vh; font-size:min(1.9vw,2.6vh); max-width:min(19vw,26vh); }
  #smStage .row.many .vt{ font-size:min(2.6vw,3.4vh); }
  #smStage .card{ display:flex; flex-direction:column; align-items:center; }
  #smStage .pic{ width:min(30vw,44vh); height:min(30vw,44vh); object-fit:cover; border-radius:2vh;
    border:.6vh solid #f0c95a; background:#241d12; box-shadow:0 0 4vh rgba(240,201,90,.45); }
  #smStage .row.one .pic{ width:min(44vw,56vh); height:min(44vw,56vh); }
  #smStage .cap{ margin-top:1.4vh; text-align:center; font-size:min(2.8vw,3.6vh); font-weight:800; max-width:min(44vw,56vh); line-height:1.3; }
  #smStage .vt{ margin-top:.6vh; font-size:min(4.2vw,5.6vh); font-weight:900; color:#f0c95a; }
  #smStage .tie{ font-size:min(3vw,4vh); font-weight:800; color:#f7efd9; display:none; }
  #smStage .tie.on{ display:block; }
</style>
</head>
<body>
<div class="stage idle" id="stage"><div class="no" id="no">大抽選会</div><div class="nm" id="nm"></div></div>
<div class="hint" id="hint">画面を1回クリックすると音が出せるようになります（F11 などで全画面に）。この文字はクリックで消えます。</div>
<div id="smStage"><!-- fq-grand-smile-v1 -->
  <div class="ttl" id="smTtl">笑顔コンテスト</div>
  <div class="row" id="smRow"></div>
  <div class="tie" id="smTie">同じ票数です。一位はこのあと会場で決めます</div>
</div>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---- 音（素材は使わず、その場で作る） ---- */
  var AC = null, NB = null;
  function ac(){
    try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) { AC = null; }
    if (AC && !NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); var d = NB.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return AC;
  }
  document.addEventListener('click', function(){ ac(); $('hint').classList.add('off'); });
  function hit(a, t, vol, len, freq, type){
    var s = a.createBufferSource(); s.buffer = NB;
    var f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7;
    var g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t, Math.random() * 0.5); s.stop(t + len + 0.05);
  }
  var rollNodesEnd = 0;
  function drumroll(sec){
    var a = ac(); if (!a) return;
    var t0 = a.currentTime + 0.05, t = t0, end = t0 + sec; rollNodesEnd = end;
    while (t < end) { var p = (t - t0) / sec; hit(a, t, 0.06 + 0.42 * p * p, 0.07, 1300 + 900 * p); t += 0.042; }
    for (var k = t0; k < end; k += 0.5) hit(a, k, 0.18 + 0.3 * (k - t0) / sec, 0.18, 140, 'lowpass');
  }
  function stopSound(){ if (AC) { try { AC.close(); } catch(e) {} } AC = null; NB = null; }
  function tick(){ var a = ac(); if (a) hit(a, a.currentTime, 0.5, 0.12, 2600); }
  function brass(a, t, fq, len, vol){
    [1, 1.004].forEach(function(det){
      var o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
      o.type = 'sawtooth'; o.frequency.value = fq * det;
      f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(3200, t + 0.06); f.Q.value = 1.2;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
      g.gain.setValueAtTime(vol, t + Math.max(0.04, len - 0.08)); g.gain.exponentialRampToValueAtTime(0.0008, t + len);
      o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + len + 0.05);
    });
  }
  function fanfare(){
    var a = ac(); if (!a) return; var t = a.currentTime + 0.02;
    hit(a, t, 0.9, 2.6, 6000, 'highpass'); hit(a, t, 0.7, 0.4, 180, 'lowpass');
    var C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, G4 = 392.0, D5 = 587.33, F5 = 698.46;
    [[G4,.10,.13],[G4,.26,.13],[G4,.42,.13],[C5,.58,.45],[E5,1.08,.13],[D5,1.24,.13],[E5,1.40,.13],[G5,1.56,.40],
     [F5,2.00,.13],[E5,2.16,.13],[D5,2.32,.13],[C6,2.48,1.60]].forEach(function(n){ brass(a, t + n[1], n[0], n[2], 0.11); });
    [C5, E5, G5].forEach(function(fq){ brass(a, t + 2.48, fq, 1.60, 0.06); });
    hit(a, t + 2.48, 0.8, 2.8, 6000, 'highpass'); hit(a, t + 2.48, 0.6, 0.5, 160, 'lowpass');
    for (var k = 0; k < 6; k++) hit(a, t + 0.58 + k * 0.32, 0.25, 0.08, 1800);
  }

  /* ---- fq-grand-v6: 花火（特賞・副賞のとき）。絵も音も、その場で作る ---- */
  var FW = { cv: null, ctx: null, shells: [], parts: [], glows: [], on: false, until: 0 };
  function fwCanvas(){
    if (FW.cv) return;
    var cv = document.createElement('canvas'); cv.id = 'fw';
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;';
    document.body.insertBefore(cv, document.body.firstChild);
    FW.cv = cv; FW.ctx = cv.getContext('2d');
    function fit(){ var r = window.devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; FW.ctx.setTransform(r, 0, 0, r, 0, 0); }
    fit(); window.addEventListener('resize', fit);
  }
  var FW_COLORS = [['#ffd36b', '#fff2c4'], ['#ff5a4f', '#ffc2a8'], ['#5fe08f', '#d6ffe2'], ['#5fb8ff', '#d9f0ff'],
                   ['#c98bff', '#f0dcff'], ['#ffffff', '#fff6d8'], ['#ff8ad0', '#ffe0f2']];
  function fwSound(kind, when){
    var a = ac(); if (!a) return; var t = a.currentTime + (when || 0);
    if (kind === 'launch') {                         // ひゅるる…
      var o = a.createOscillator(), g = a.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(1800, t + 1.0);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.1);
    } else if (kind === 'boom') {                    // ドーン
      hit(a, t, 0.95, 1.6, 110, 'lowpass'); hit(a, t, 0.5, 0.5, 400, 'lowpass');
    } else if (kind === 'crackle') {                 // パチパチ
      for (var i = 0; i < 26; i++) hit(a, t + 0.35 + Math.random() * 1.2, 0.05 + Math.random() * 0.08, 0.03, 3000 + Math.random() * 3000);
    }
  }
  function fwLaunch(delay){
    setTimeout(function(){
      if (!FW.on) return;
      var W = innerWidth, H = innerHeight;
      var x = W * (0.1 + Math.random() * 0.8), ty = H * (0.1 + Math.random() * 0.38);
      var vy = -Math.sqrt(2 * 0.13 * (H - ty));      // その高さで止まる速さ
      FW.shells.push({ x: x, y: H + 10, vx: (Math.random() - 0.5) * 1.2, vy: vy, trail: [], col: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
                       type: ['peony', 'peony', 'willow', 'ring', 'double'][Math.floor(Math.random() * 5)] });
      fwSound('launch');
    }, delay);
  }
  function fwBurst(s){
    var n = s.type === 'ring' ? 120 : 210, base = Math.min(innerWidth, innerHeight) / 68 * (FW.big ? 1.35 : 1);   // fq-grand-v7: 特賞はひと回り大きく
    var tilt = Math.random() * Math.PI;
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2, sp = base * (0.55 + Math.random() * 0.55);
      if (s.type === 'ring') { ang = (i / n) * Math.PI * 2; sp = base; }
      var vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp;
      if (s.type === 'ring') { vy *= Math.cos(tilt); }
      var willow = s.type === 'willow';
      FW.parts.push({ x: s.x, y: s.y, vx: vx, vy: vy, life: 1, decay: willow ? 0.0055 : 0.010 + Math.random() * 0.007,
                      col: willow ? '#ffcf6b' : (i % 3 === 0 ? s.col[1] : s.col[0]), trail: [], tl: willow ? 14 : 6,
                      drag: willow ? 0.965 : 0.955, g: willow ? 0.045 : 0.06, glitter: Math.random() < 0.3 });
    }
    if (s.type === 'double') {                       // 内側にもう1つの色
      var c2 = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)][0];
      for (var j = 0; j < 70; j++) {
        var a2 = Math.random() * Math.PI * 2, sp2 = base * 0.45 * (0.6 + Math.random() * 0.4);
        FW.parts.push({ x: s.x, y: s.y, vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2, life: 1, decay: 0.014, col: c2, trail: [], tl: 5, drag: 0.95, g: 0.06, glitter: false });
      }
    }
    FW.glows.push({ x: s.x, y: s.y, r: base * 9, life: 1, col: s.col[0] });   // 開いた瞬間の光
    fwSound('boom'); fwSound('crackle');
    var st = document.getElementById('stage');            // 夜空がぱっと明るくなる
    if (st) { st.style.transition = 'none'; st.style.filter = 'brightness(1.5)'; setTimeout(function(){ st.style.transition = 'filter .6s'; st.style.filter = ''; }, 60); }
  }
  function fwFrame(){
    var c = FW.ctx, W = innerWidth, H = innerHeight;
    c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    for (var i = FW.shells.length - 1; i >= 0; i--) {
      var s = FW.shells[i];
      s.trail.push([s.x, s.y]); if (s.trail.length > 10) s.trail.shift();
      s.x += s.vx; s.y += s.vy; s.vy += 0.13;
      c.strokeStyle = 'rgba(255,220,160,.8)'; c.lineWidth = 2.2; c.beginPath();
      c.moveTo(s.trail[0][0], s.trail[0][1]); for (var k = 1; k < s.trail.length; k++) c.lineTo(s.trail[k][0], s.trail[k][1]); c.lineTo(s.x, s.y); c.stroke();
      if (s.vy >= -0.5) { fwBurst(s); FW.shells.splice(i, 1); }
    }
    for (var p = FW.parts.length - 1; p >= 0; p--) {
      var q = FW.parts[p];
      q.trail.push([q.x, q.y]); if (q.trail.length > q.tl) q.trail.shift();
      q.vx *= q.drag; q.vy = q.vy * q.drag + q.g; q.x += q.vx; q.y += q.vy; q.life -= q.decay;
      if (q.life <= 0) { FW.parts.splice(p, 1); continue; }
      var al = Math.max(0, q.life) * (q.glitter && Math.random() < 0.35 ? 0.25 : 1);
      c.globalAlpha = al; c.strokeStyle = q.col; c.lineWidth = 3.2 * Math.max(0.45, q.life);
      c.beginPath(); c.moveTo(q.trail[0][0], q.trail[0][1]); for (var m = 1; m < q.trail.length; m++) c.lineTo(q.trail[m][0], q.trail[m][1]); c.lineTo(q.x, q.y); c.stroke();
    }
    for (var gI = FW.glows.length - 1; gI >= 0; gI--) {
      var gw = FW.glows[gI]; gw.life -= 0.06; if (gw.life <= 0) { FW.glows.splice(gI, 1); continue; }
      var grd = c.createRadialGradient(gw.x, gw.y, 0, gw.x, gw.y, gw.r);
      grd.addColorStop(0, gw.col); grd.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = gw.life * 0.45; c.fillStyle = grd; c.beginPath(); c.arc(gw.x, gw.y, gw.r, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    if (FW.on || FW.shells.length || FW.parts.length || FW.glows.length) requestAnimationFrame(fwFrame);
    else c.clearRect(0, 0, W, H);
  }
  function fireworks(sec, big){
    fwCanvas(); FW.big = !!big;   // fq-grand-v7
    var wasOn = FW.on; FW.on = true; FW.until = Date.now() + sec * 1000;
    var t = 0;
    if (big) {                    // 特賞：2〜3発ずつ、間をあけずに
      while (t < sec * 1000 - 2200) { fwLaunch(t); fwLaunch(t + 140); if (Math.random() < 0.6) fwLaunch(t + 300); t += 380 + Math.random() * 320; }
      for (var f2 = 0; f2 < 12; f2++) fwLaunch(sec * 1000 - 2100 + f2 * 110);   // 最後に12発の連発
    } else {
      while (t < sec * 1000 - 1500) { fwLaunch(t); if (Math.random() < 0.45) fwLaunch(t + 120); t += 450 + Math.random() * 450; }
      for (var f = 0; f < 5; f++) fwLaunch(sec * 1000 - 1400 + f * 90);      // 最後にまとめて
    }
    setTimeout(function(){ if (Date.now() >= FW.until) FW.on = false; }, sec * 1000);
    if (!wasOn) requestAnimationFrame(fwFrame);
  }
  function fireworksStop(){ FW.on = false; FW.shells = []; FW.parts = []; FW.glows = []; if (typeof confettiStop === 'function') confettiStop(); }
  window.fqFireworks = fireworks;   // 試すとき用

  /* ---- fq-grand-v7: 紙吹雪（特賞のとき）。文字の手前を舞い落ちる ---- */
  var CF = { cv: null, ctx: null, ps: [], on: false };
  var CF_COLORS = ['#ffd36b', '#ff5a4f', '#5fe08f', '#5fb8ff', '#c98bff', '#ff8ad0', '#ffffff', '#f0c95a'];
  function cfCanvas(){
    if (CF.cv) return;
    var cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;';
    document.body.appendChild(cv); CF.cv = cv; CF.ctx = cv.getContext('2d');
    function fit(){ var r = window.devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; CF.ctx.setTransform(r, 0, 0, r, 0, 0); }
    fit(); window.addEventListener('resize', fit);
  }
  function cfAdd(n, burst){
    var W = innerWidth, H = innerHeight, sz = Math.min(W, H) / 70;
    for (var i = 0; i < n; i++) {
      var p = { x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 1.5, vy: 1.2 + Math.random() * 2.2,
                w: sz * (0.7 + Math.random() * 0.7), h: sz * (0.35 + Math.random() * 0.4), rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.25,
                flip: Math.random() * 6.28, vf: 0.08 + Math.random() * 0.12, sway: Math.random() * 6.28, col: CF_COLORS[Math.floor(Math.random() * CF_COLORS.length)],
                shiny: Math.random() < 0.25 };
      if (burst) {                                           // 左右の下からキャノンで打ち上げる
        var left = i % 2 === 0; p.x = left ? W * 0.02 : W * 0.98; p.y = H * 0.98;
        var ang = (left ? -1 : -1) * (Math.PI / 2) + (left ? 0.35 : -0.35) + (Math.random() - 0.5) * 0.5;
        var sp = Math.min(W, H) / 38 * (0.7 + Math.random() * 0.6);
        p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp;
      }
      CF.ps.push(p);
    }
  }
  function cfFrame(){
    var c = CF.ctx, W = innerWidth, H = innerHeight; c.clearRect(0, 0, W, H);
    for (var i = CF.ps.length - 1; i >= 0; i--) {
      var p = CF.ps[i];
      if (p.vy > 3.4) p.vy = p.vy * 0.96 + 0.1; else p.vy += 0.09;   // 空気でふわっと落ちる
      p.vx *= 0.985; p.sway += 0.05; p.x += p.vx + Math.sin(p.sway) * 0.9; p.y += p.vy; p.rot += p.vr; p.flip += p.vf;
      if (p.y > H + 30) { CF.ps.splice(i, 1); continue; }
      var fy = Math.cos(p.flip);                                    // くるくる裏返る
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, fy);
      c.fillStyle = p.col; c.globalAlpha = 0.95; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      if (p.shiny && fy > 0.6) { c.globalAlpha = 0.6; c.fillStyle = '#ffffff'; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * 0.3); }
      c.restore();
    }
    if (CF.on || CF.ps.length) requestAnimationFrame(cfFrame); else c.clearRect(0, 0, W, H);
  }
  function confetti(sec){
    cfCanvas(); var was = CF.on || CF.ps.length; CF.on = true;
    cfAdd(160, true); cfAdd(220, false);                          // はじめにどっと
    var t = 0, iv = setInterval(function(){ t += 400; if (!CF.on || t > sec * 1000) { clearInterval(iv); CF.on = false; return; } cfAdd(28, false); }, 400);
    setTimeout(function(){ if (CF.on) cfAdd(140, true); }, 2600);   // もう一度キャノン
    if (!was) requestAnimationFrame(cfFrame);
  }
  function confettiStop(){ CF.on = false; CF.ps = []; }
  window.fqConfetti = confetti;   // 試すとき用

  /* ---- 発表の流れ（本部モニターと同じ時間割） ---- */
  var SPIN_MS = 6500, STEP_MS = 1000, LAST_EXTRA_MS = 1800;
  var run = null;   // いまの発表
  function showDigits(digits, locked){
    $('no').innerHTML = digits.map(function(c, i){ return '<span' + (locked[i] ? ' class="lock"' : '') + '>' + esc(c) + '</span>'; }).join('');
  }
  function idle(){
    run = null; $('stage').classList.add('idle'); $('no').textContent = '大抽選会';
    $('nm').textContent = ''; $('nm').classList.remove('show');
  }
  function start(n, label){
    smStop();                       // fq-grand-smile-v1: 番号の抽選に移るときは笑顔の発表を消す
    stopSound(); fireworksStop();   // fq-grand-v6
    $('stage').classList.remove('idle'); $('nm').textContent = ''; $('nm').classList.remove('show');
    run = { n: n || 4, answer: null, locked: [], t0: Date.now(), last: 0, label: String(label || '') };
    drumroll((SPIN_MS + STEP_MS * (run.n - 1) + LAST_EXTRA_MS) / 1000);
    var me = run;
    (function frame(){
      if (run !== me) return;
      var el = Date.now() - me.t0, n = me.n, ans = me.answer ? String(me.answer.recog_no) : '';
      var lockAt = []; for (var i = 0; i < n; i++) lockAt.push(SPIN_MS + STEP_MS * i + (i === n - 1 ? LAST_EXTRA_MS : 0));
      var gap = el < SPIN_MS - 1500 ? 45 : 45 + (el - (SPIN_MS - 1500)) / 20;
      if (el - me.last >= Math.min(gap, 220)) {
        me.last = el;
        var digits = [];
        for (var j = 0; j < n; j++) {
          var lk = !!me.answer && el >= lockAt[j];
          if (lk && !me.locked[j]) { me.locked[j] = true; if (j < n - 1) tick(); }
          digits.push(lk ? ans.charAt(j) : String(Math.floor(Math.random() * 10)));
        }
        showDigits(digits, me.locked);
      }
      if (me.answer && el >= lockAt[n - 1]) {
        var fin = ans.split(''); showDigits(fin, fin.map(function(){ return true; }));
        fanfare();
        if (/特賞/.test(me.label)) { fireworks(16, true); confetti(14); }   // fq-grand-v7: 特賞は盛大に＋紙吹雪
        else if (/副賞/.test(me.label)) fireworks(9);                       // fq-grand-v6: 副賞は花火
        var st = $('stage'); st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
        $('nm').textContent = me.answer.nickname || ''; $('nm').classList.add('show');
        return;
      }
      requestAnimationFrame(frame);
    })();
  }

  /* ---- fq-grand-smile-v1: 笑顔コンテストの1位発表。本部モニターから写真と票数をもらって見せるだけ ---- */
  var SM = null;
  function escA(s){ return esc(s).replace(/"/g, '&quot;'); }
  function smCard(it){
    var u = String(it.u == null ? '' : it.u), t = String(it.t == null ? '' : it.t);
    var v = (it.v == null ? null : (it.v | 0)), no = String(it.no == null ? '' : it.no);
    return '<div class="card">'
         + (u ? '<img class="pic" alt="" src="' + escA(u) + '">' : '<div class="pic"></div>')
         + '<div class="cap">' + (no ? esc(no) + '\u756a\u3000' : '') + esc(t)
         + (v === null ? '' : '<div class="vt">' + v + '\u7968</div>') + '</div></div>';
  }
  function smStop(){
    if (SM) { if (SM.timer) clearInterval(SM.timer); if (SM.end) clearTimeout(SM.end); }
    SM = null;
    $('smStage').classList.remove('on'); $('smTie').classList.remove('on'); $('smRow').innerHTML = '';
  }
  function smileShow(m){
    smStop(); stopSound(); fireworksStop(); run = null;
    var win = (m.win && m.win.length) ? m.win : [];
    var all = (m.all && m.all.length) ? m.all : win;
    var sec = Math.max(2, Math.min(20, (+m.sec) || 7));
    $('stage').classList.remove('idle'); $('no').textContent = '';
    $('nm').textContent = ''; $('nm').classList.remove('show');
    $('smStage').classList.add('on');
    $('smTtl').textContent = '\u7b11\u9854\u30b3\u30f3\u30c6\u30b9\u30c8\u3000\u7b2c\uff11\u4f4d\u306f\u2026';
    $('smRow').className = 'row one';
    var i = 0;
    $('smRow').innerHTML = smCard({ u: (all[0] || {}).u, t: '\uff1f\uff1f\uff1f' });
    drumroll(sec);
    var me = { };
    SM = me;
    me.timer = setInterval(function(){
      if (SM !== me) return;
      i = (i + 1) % Math.max(1, all.length);
      $('smRow').innerHTML = smCard({ u: (all[i] || {}).u, t: '\uff1f\uff1f\uff1f' });
    }, 140);
    me.end = setTimeout(function(){
      if (SM !== me) return;
      clearInterval(me.timer); me.timer = null;
      $('smTtl').textContent = '\u7b11\u9854\u30b3\u30f3\u30c6\u30b9\u30c8\u3000\u7b2c\uff11\u4f4d';
      $('smRow').className = 'row' + (win.length === 1 ? ' one' : (win.length >= 4 ? ' many' : ''));
      $('smRow').innerHTML = win.length
        ? win.map(function(w){ return smCard(w); }).join('')
        : smCard({ t: '\uff08\u5199\u771f\u304c\u3042\u308a\u307e\u305b\u3093\uff09' });
      if (win.length > 1) $('smTie').classList.add('on');
      fanfare(); fireworks(16, true); confetti(14);
      var st = $('stage'); st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
    }, sec * 1000);
  }
  /* ---- 本部モニターからの合図 ---- */
  function onMsg(m){
    if (!m || typeof m !== 'object') return;
    if (m.type === 'ping') { send({ type: 'hello' }); return; }
    if (m.type === 'smile') { smileShow(m); return; }                                      /* fq-grand-smile-v1 */
    if (m.type === 'smileStop') { smStop(); stopSound(); fireworksStop(); idle(); return; }  /* fq-grand-smile-v1 */
    if (m.type === 'start') start(m.n, m.label);
    else if (m.type === 'result' && run) { run.answer = { recog_no: String(m.recog_no || ''), nickname: String(m.nickname || '') }; run.n = run.answer.recog_no.length || run.n; }
    else if (m.type === 'abort' || m.type === 'clear') { smStop(); stopSound(); fireworksStop(); idle(); }   /* fq-grand-smile-v1: smStop を足した */
  }
  var bc = null;
  try { bc = new BroadcastChannel('fq-grand'); bc.onmessage = function(e){ onMsg(e.data); }; } catch(e) { bc = null; }
  function send(m){ if (bc) try { bc.postMessage(m); } catch(e) {} }
  send({ type: 'hello' });
})();
</script>
