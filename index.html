<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://festa.lifeplusllc.com/">
<title>つながるフェスタ（新しい住所へ移動中）</title>
<!-- == fq-move-v1 : 前の住所（cocokaraplus-max.github.io/fukushi-quest/）の転送ページ ==
     ★アプリは https://festa.lifeplusllc.com/ に引っ越した。
     ★前に一度開いたスマホには、古い「控えの仕組み（service worker）」と古い画面の控えが残っている。
       それを消してから、同じページ・同じ ?q= などのまま新しい住所へ移す。
     ★このファイルは index.html と 404.html の2つに同じものを置く（どのページを開かれても転送できるように）。 -->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f2ecdd;color:#463a2c;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;text-align:center;}
  .b{padding:24px;line-height:1.9;font-weight:700;font-size:15px;}
  a{color:#df5b45;font-weight:900;}
</style>
</head>
<body>
<div class="b">つながるフェスタのページへ移動しています…<br>
  <a id="go" href="https://festa.lifeplusllc.com/">うまく移らないときは、ここを押してください</a></div>
<script>
(function(){
  var NEW = 'https://festa.lifeplusllc.com/';
  var p = location.pathname.replace(/^\/fukushi-quest\/?/, '');
  var to = NEW + p + location.search + location.hash;
  try{ document.getElementById('go').href = to; }catch(e){}
  var done = false;
  function go(){ if(done) return; done = true; location.replace(to); }
  setTimeout(go, 1500);   /* 片づけが終わらなくても 1.5 秒で移る */
  var jobs = [];
  try{
    if('serviceWorker' in navigator){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
    if(window.caches){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }));
    }
  }catch(e){}
  Promise.all(jobs).then(go, go);
})();
</script>
</body>
</html>
